<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:"Plus Jakarta Sans",sans-serif;-webkit-font-smoothing:antialiased}
  .cadre{width:1200px;height:630px;position:relative;overflow:hidden}
</style><style>
  .cadre{background:#F4F6F2}
  .lueur{position:absolute;inset:0;background:
    radial-gradient(58% 70% at 8% 0%, rgba(0,113,61,.10) 0%, rgba(0,113,61,0) 62%),
    radial-gradient(46% 58% at 100% 100%, rgba(0,113,61,.07) 0%, rgba(0,113,61,0) 60%)}
  .contenu{position:absolute;inset:0;padding:70px 76px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{width:330px}
  h1{font-size:74px;font-weight:800;line-height:1.06;letter-spacing:-.032em;color:#131814;max-width:19ch}
  .vert{color:#00713D}
  p{margin-top:26px;font-size:26px;font-weight:500;line-height:1.42;color:#5E655F;max-width:34ch}
  .pied{display:flex;align-items:center;gap:18px}
  .barre{width:56px;height:5px;border-radius:3px;background:#00713D}
  .site{font-size:23px;font-weight:700;color:#131814;letter-spacing:-.01em}
</style></head><body><div class="cadre"><div class="lueur"></div><div class="contenu">
  <img class="logo" src="logo.svg" alt="">
  <div>
    <h1>Vos clients vous cherchent sur <span class="vert">Google</span></h1>
    <p>Référencement, site web et publicité en ligne pour les PME de Lyon et de toute la France.</p>
  </div>
  <div class="pied"><span class="barre"></span><span class="site">123digital.fr</span></div>
</div></div></body></html>
