<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Subtle green glow top-left -->
  <ellipse cx="200" cy="0" rx="500" ry="300" fill="rgba(0,255,135,0.04)"/>
  <!-- Subtle cream glow bottom-right -->
  <ellipse cx="1100" cy="630" rx="400" ry="250" fill="rgba(225,224,204,0.04)"/>

  <!-- Brand -->
  <text
    x="96" y="220"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="96"
    font-weight="500"
    letter-spacing="-3"
    fill="#E1E0CC"
  >123 Digital</text>

  <!-- Divider -->
  <rect x="96" y="252" width="60" height="2" fill="#00FF87"/>

  <!-- Tagline -->
  <text
    x="96" y="320"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="400"
    fill="rgba(225,224,204,0.65)"
  >Expert en croissance digitale pour PME françaises</text>

  <!-- Services -->
  <text
    x="96" y="390"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20"
    font-weight="400"
    letter-spacing="2"
    fill="rgba(225,224,204,0.35)"
  >SEO · SITES WEB · PUBLICITÉ · BRANDING · AUTOMATISATION</text>

  <!-- Availability badge -->
  <circle cx="96" cy="470" r="6" fill="#00FF87"/>
  <text
    x="114" y="475"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="400"
    fill="rgba(225,224,204,0.45)"
