  >Disponible — Audit gratuit 30 min</text>

  <!-- URL -->
  <text
    x="96" y="560"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="400"
    fill="rgba(225,224,204,0.3)"
